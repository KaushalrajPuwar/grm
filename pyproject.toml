[project]
name = "grm"
version = "0.1.0"
description = "OpenG2P Beneficiary Conversational Agent for grievance redressal over voice and chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # FastAPI and Pydantic models read better without these.
    "B008",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Constitutions are prose, not code.
"src/grm/prompts/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
packages = ["grm"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# The model clients and FastAPI are untyped at the boundary; the contracts
# inside our own modules are still checked.
module = [
    "langchain_core.*",
    "langchain_openai.*",
    "structlog.*",
    "uvicorn.*",
]
ignore_missing_imports = true